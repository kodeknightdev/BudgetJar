<section class="card">
  <div class="toolbar">
    <h2>Transactions</h2>
    <input type="month" #monthInput [value]="monthValue" (change)="onMonthChange(monthInput.value)">
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Category</th>
        <th>Description</th>
        <th class="amount">Amount</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of transactions">
        <td>{{ t.date | date:'mediumDate' }}</td>
        <td>{{ t.categoryName }}</td>
        <td>{{ t.description }}</td>
        <td class="amount" [class.income]="t.type === 'Income'" [class.expense]="t.type === 'Expense'">
          {{ t.type === 'Expense' ? '-' : '' }}{{ t.amount | number:'1.2-2' }}
        </td>
        <td class="actions">
          <button class="link danger" (click)="remove(t)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
