version: "3.8"

# Local SQL Server for development (handy on macOS / Linux where LocalDB isn't available).
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "BudgetJar_dev1!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
